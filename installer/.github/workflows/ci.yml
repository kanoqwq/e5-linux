name: Installer offline regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Python dependencies (no firmware or device access)
        run: python -m pip install paramiko lz4 cryptography rsa -r ota-requirements.txt
      - name: Windows offline regression
        if: runner.os == 'Windows'
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Linux offline regression (ownership and temporary filesystem fixtures)
        if: runner.os == 'Linux'
        run: sudo -E "$(which python)" -X utf8 -m unittest discover -s tests -v
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui run build
